name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: banktech
          POSTGRES_PASSWORD: banktech
          POSTGRES_DB: banktech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banktech" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://banktech:banktech@localhost:5432/banktech?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      SEED_ADMIN_EMAIL: admin@ci.local
      SEED_ADMIN_PASSWORD: ci-admin-password-123
      SEED_DEMO_EMAIL: demo@ci.local
      SEED_DEMO_PASSWORD: ci-demo-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: End-to-end smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
