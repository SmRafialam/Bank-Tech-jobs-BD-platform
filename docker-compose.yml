# Local / VPS deployment: PostgreSQL + one-off migrate/seed + web app + scheduler worker.
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: banktech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banktech}
      POSTGRES_DB: banktech
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banktech -d banktech"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://banktech:${POSTGRES_PASSWORD:-banktech}@db:5432/banktech?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://banktech:${POSTGRES_PASSWORD:-banktech}@db:5432/banktech?schema=public
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://banktech:${POSTGRES_PASSWORD:-banktech}@db:5432/banktech?schema=public
      PLAYWRIGHT_ENABLED: "true"
    shm_size: 1gb
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
